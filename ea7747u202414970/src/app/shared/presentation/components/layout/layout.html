<mat-toolbar class="toolbar">

  <div class="brand">
    <img class="logo" [src]="logoUrl" [alt]="'toolbar.logo-alt' | translate" width="40" height="40"/>
    <span class="organization-name">{{ 'toolbar.organization-name' | translate }}</span>
  </div>

  <nav class="options" [attr.aria-label]="'toolbar.navigation' | translate">
    @for (option of options(); track option.label) {
      <a mat-button [routerLink]="option.link" routerLinkActive="active"
         ariaCurrentWhenActive="page">{{ option.label | translate }}</a>
    }
  </nav>

  <div class="language">
    <app-language-switcher/>
  </div>
</mat-toolbar>

<main class="content">
  <router-outlet/>
</main>
<app-footer-content/>
